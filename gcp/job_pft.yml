workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-4  # Serie G2 incluye la GPU L4
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    pythonPackageSpec:
      executorImageUri: us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-1.py310:latest
      packageUris:
        - gs://distiltbert-train/code/gcp_task-0.1.tar.gz
      pythonModule: gcp_task 
      args:
        - --data_path=gs://distiltbert-train/data/raw_data_HScodes_desc.txt
        - --output_bucket=distiltbert-train
        - --job_dir=experiments/PFT_PartialFineTune
        - --train_type=pft
        - --iterations=10
        - --max_epochs=12
  - scheduling:
      strategy: FLEX_START
      maxWaitDuration: 7200s