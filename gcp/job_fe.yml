workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-4
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/hsclassi/model-training-repo/hs-classifier:v10
      
      args:
        - --data_path=gs://distiltbert-train/data/raw_data_HScodes_desc.txt
        - --output_bucket=distiltbert-train
        - --job_dir=experiments/job_fe_v10
        - --train_type=fe
        - --iterations=5
        - --max_epochs=24
        - --num_workers=2
        - --batch_size=128
        - --lr=1.5e-4

scheduling:
  strategy: FLEX_START
  maxWaitDuration: 7200s