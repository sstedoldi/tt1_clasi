workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-4
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/hsclassi/model-training-repo/hs-classifier:v1
      
      args:
        - --data_path=gs://distiltbert-train/data/raw_data_HScodes_desc.txt
        - --output_bucket=distiltbert-train
        - --job_dir=experiments/custom_container_v1
        - --train_type=fe
        - --iterations=2
        - --max_epochs=3
        - --num_workers=2

scheduling:
  strategy: FLEX_START
  maxWaitDuration: 7200s